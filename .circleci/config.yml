# CircleCI configuration for Psecas.
#
# The previous configuration pinned circleci/python:3.6.1. Python 3.6 reached
# end of life in December 2021 and the circleci/* image namespace is
# deprecated in favour of cimg/*. CI was therefore exercising an interpreter
# nobody runs the code on, while development happens on 3.12+.
version: 2.1

orbs:
  codecov: codecov/codecov@4.1.0

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
            - v2-deps-<< parameters.python-version >>-{{ checksum "pyproject.toml" }}
            - v2-deps-<< parameters.python-version >>-

      - run:
          name: Install package and test dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            python -m pip install --upgrade pip
            # Install the package itself, so CI tests what users install
            # rather than whatever happens to be importable from the
            # working directory.
            python -m pip install -e '.[test,dmsuite,mpi]'

      - save_cache:
          paths:
            - ./venv
          key: v2-deps-<< parameters.python-version >>-{{ checksum "pyproject.toml" }}

      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            mkdir -p test-reports
            pytest --cov=psecas --cov-report=xml \
                   --junitxml=test-reports/junit.xml tests

      - store_test_results:
          path: test-reports

      - store_artifacts:
          path: test-reports

      - codecov/upload:
          file: coverage.xml

workflows:
  build:
    jobs:
      # Test the oldest supported interpreter and a current one. The
      # floor is set by requires-python in pyproject.toml.
      - test:
          matrix:
            parameters:
              python-version: ["3.9", "3.12"]
